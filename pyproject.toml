[project]
name = "personal-toolkit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.10.0",
]

[project.scripts]
quiet-market-pulse = "personal_toolkit.quiet_market_pulse.cli:main"
quiet-market-pulse-ui = "personal_toolkit.quiet_market_pulse.tray:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]
ignore = [
    "E501",
]
